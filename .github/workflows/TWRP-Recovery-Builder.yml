
name: TWRP Recovery Builder 2024

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-14.1'
        type: choice
        options:
          - twrp-14.1
          - twrp-12.1
          - twrp-11
          - twrp-9.0

      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/vinokesunean-art/android_device_kn3'

      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'master'

      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/tecno/tssi'  # <-- Kamu pake device/spark/kn3, sesuaikan

      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'tssi'

      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
          - vendorboot
          - boot
          - recovery

      LDCHECK:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/qseecomd'

      RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean

      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: false

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04

    if: github.event.repository.owner.id == github.event.sender.id

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:
      # 🔔 NOTIFIKASI MULAI (PAKAI CURL)
      - name: Kirim Notifikasi Mulai Build
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🚀 **Memulai Build TWRP untuk ${{ github.event.inputs.DEVICE_NAME }}!**%0A%0A📦 **Repo:** ${{ github.repository }}%0A🌿 **Branch:** ${{ github.event.inputs.MANIFEST_BRANCH }}%0A📱 **Device:** ${{ github.event.inputs.DEVICE_NAME }}%0A🔧 **Target:** ${{ github.event.inputs.BUILD_TARGET }}image%0A👤 **User:** ${{ github.actor }}%0A%0A⏳ Mohon tunggu, proses sedang berjalan..." \
            -d "parse_mode=Markdown"

      - name: Check Out
        uses: actions/checkout@v3

      - name: Display Inputs
        run: |
          echo "::group::User Environment Variables"
          echo "Displaying variables/inputs."
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
          echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
          echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}image"
          echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
          echo "Release recovery.tar For Samsung devices: ${{ github.event.inputs.RECOVERY_TAR }}"
          echo "::endgroup::"

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Prepare the environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          sudo apt -y install \
            gperf \
            gcc-multilib \
            gcc-10-multilib \
            g++-multilib \
            g++-10-multilib \
            lib32ncurses5-dev \
            x11proto-core-dev \
            lib32z-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            bc \
            ccache \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5-dev \
            libsdl1.2-dev \
            libwxgtk3.0-gtk3-dev \
            lzop \
            pngcrush \
            schedtool \
            squashfs-tools \
            imagemagick \
            libbz2-dev \
            lzma \
            ncftp \
            qemu-user-static \
            libstdc++-10-dev \
            libtinfo5 \
            libgflags-dev

          sudo add-apt-repository universe
          sudo apt -y install libncurses5

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Install Git-Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Check Manifest Branch
        uses: haya14busa/action-cond@v1
        id: manifest
        with:
          cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
          if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
          if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

      - name: Initialize Repo
        run: |
          mkdir -p workspace
          cd workspace

          git config --global user.name "TWRP Builder"
          git config --global user.email "actions@github.com"

          repo init \
            --depth=1 \
            -u ${{ steps.manifest.outputs.value }} \
            -b ${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Repo Sync
        run: |
          cd workspace
          repo sync -j$(nproc --all) --force-sync

      - name: Clone Device Tree
        run: |
          cd workspace

          git clone \
            ${{ github.event.inputs.DEVICE_TREE }} \
            -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
            ./${{ github.event.inputs.DEVICE_PATH }}

          cd ${{ github.event.inputs.DEVICE_PATH }}

          echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check Build Makefile
        run: |
          cd workspace

          if [ -f "${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME }}.mk" ]; then
              echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
              echo "Found TWRP makefile:"
              echo "${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME }}.mk"

          elif [ -f "${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME }}.mk" ]; then
              echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
              echo "Found Omni makefile:"
              echo "${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME }}.mk"

          else
              echo "No recovery makefile found!"
              exit 1
          fi

      - name: Install Python 2
        if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1' && github.event.inputs.MANIFEST_BRANCH != 'twrp-14.1'
        run: |
          sudo apt -y install python2
          cd /usr/bin
          sudo ln -sf python2 python

      # ==============================================================
      # 🔧 FIX LUNCH COMBO - Cari Combo yang Tersedia
      # ==============================================================
      - name: Find Available Lunch Combo
        id: find_lunch
        run: |
          cd workspace
          source build/envsetup.sh
          # Tampilkan semua combo yang tersedia
          echo "Available lunch combos:"
          lunch 2>&1 | grep -E "^[a-z_]+-[a-z]+-[a-z]+" || true
          # Coba ambil dari vendorsetup.sh
          if [ -f "${{ github.event.inputs.DEVICE_PATH }}/vendorsetup.sh" ]; then
            echo "Vendorsetup content:"
            cat ${{ github.event.inputs.DEVICE_PATH }}/vendorsetup.sh
            # Ekstrak combo dari add_lunch_combo
            COMBO=$(grep -oP 'add_lunch_combo\s+\K[^\s]+' ${{ github.event.inputs.DEVICE_PATH }}/vendorsetup.sh | head -1)
            if [ -n "$COMBO" ]; then
              echo "COMBO=$COMBO" >> $GITHUB_OUTPUT
              echo "Found combo: $COMBO"
            else
              # Coba cari di AndroidProducts.mk
              if [ -f "${{ github.event.inputs.DEVICE_PATH }}/AndroidProducts.mk" ]; then
                COMBO=$(grep -oP 'COMMON_LUNCH_CHOICES\s*\+=\s*\K[^\s]+' ${{ github.event.inputs.DEVICE_PATH }}/AndroidProducts.mk | head -1)
                if [ -n "$COMBO" ]; then
                  echo "COMBO=$COMBO" >> $GITHUB_OUTPUT
                  echo "Found combo from AndroidProducts: $COMBO"
                fi
              fi
            fi
          fi

      - name: Building Image
        id: build
        run: |
          cd workspace

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          # Gunakan combo yang ditemukan, atau fallback ke twrp_tssi-eng
          COMBO="${{ steps.find_lunch.outputs.COMBO }}"
          if [ -z "$COMBO" ]; then
            # Fallback: coba twrp_tssi-eng atau omni_tssi-eng
            if [ -f "${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME }}.mk" ]; then
              COMBO="twrp_${{ github.event.inputs.DEVICE_NAME }}-eng"
            else
              COMBO="omni_${{ github.event.inputs.DEVICE_NAME }}-eng"
            fi
          fi

          echo "============================================"
          echo "BUILD INFORMATION"
          echo "============================================"
          echo "DEVICE_NAME      = ${{ github.event.inputs.DEVICE_NAME }}"
          echo "DEVICE_PATH      = ${{ github.event.inputs.DEVICE_PATH }}"
          echo "DEVICE_MAKEFILE  = ${{ env.DEVICE_MAKEFILE }}"
          echo "BUILD_TARGET     = ${{ github.event.inputs.BUILD_TARGET }}image"
          echo "LUNCH COMBO      = $COMBO"
          echo "============================================"

          lunch $COMBO

          make clean

          make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

          echo "============================================"
          echo "BUILD COMPLETED"
          echo "============================================"

      # ... (lanjutkan step lainnya: Set Build Date, Check Build Output, Upload, dll) ...

      # ==========================================================
      # ✅ NOTIFIKASI BERHASIL (PAKAI CURL)
      # ==========================================================
      - name: Kirim Notifikasi Build Berhasil
        if: success()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ **Build TWRP untuk ${{ github.event.inputs.DEVICE_NAME }} BERHASIL!** 🎉%0A%0A📦 **Repo:** ${{ github.repository }}%0A🌿 **Branch:** ${{ github.event.inputs.MANIFEST_BRANCH }}%0A📱 **Device:** ${{ github.event.inputs.DEVICE_NAME }}%0A🔧 **Target:** ${{ github.event.inputs.BUILD_TARGET }}image%0A%0A🔗 **Detail:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "parse_mode=Markdown"

      # ==========================================================
      # ❌ NOTIFIKASI GAGAL (PAKAI CURL)
      # ==========================================================
      - name: Kirim Notifikasi Build Gagal
        if: failure()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ **Build TWRP untuk ${{ github.event.inputs.DEVICE_NAME }} GAGAL!** 😢%0A%0A📦 **Repo:** ${{ github.repository }}%0A🌿 **Branch:** ${{ github.event.inputs.MANIFEST_BRANCH }}%0A📱 **Device:** ${{ github.event.inputs.DEVICE_NAME }}%0A🔧 **Target:** ${{ github.event.inputs.BUILD_TARGET }}image%0A%0A⚠️ **Cek log di GitHub Actions untuk detail error.**%0A🔗 **Detail:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "parse_mode=Markdown"

      - name: Kirim Log Error (50 baris terakhir)
        if: failure()
        run: |
          LOG=$(tail -n 50 workspace/build.log 2>/dev/null | sed 's/"/\\"/g')
          if [ -n "$LOG" ]; then
            curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=⚠️ **Log error (50 baris terakhir):**%0A%0A\`\`\`%0A$LOG%0A\`\`\`" \
              -d "parse_mode=Markdown"
          else
            curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=⚠️ **Log tidak ditemukan.**%0A%0A🔗 Cek detail di GitHub Actions" \
              -d "parse_mode=Markdown"
          fi